[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
oculus-protocol = { path = "crates/oculus-protocol" }
oculus-core = { path = "crates/oculus-core" }
oculus-watch = { path = "crates/oculus-watch" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
sys-locale = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "jsonpatch", "rustls-tls", "ring", "oidc", "http-proxy", "gzip"] }
# La versión de la API más antigua soportada: no usamos campos que un clúster viejo no tenga.
k8s-openapi = { version = "0.28", features = ["v1_32"] }
notify = "8"
sha2 = "0.11"
hex = "0.4"
dirs = "7"
which = "8"
futures = "0.3"
http = "1"
http-body-util = "0.1"
json-patch = "4"
tower-test = "0.4"

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"

# tauri-specta sigue en RC: versiones exactas para que no cambien solas (riesgo 8).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
